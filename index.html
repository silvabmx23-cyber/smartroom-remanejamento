<script>
    let dadosAtuais = {};

    const dadosPadrao = {
      atualizado_em: "10:15",
      disciplina: "Desenvolvimento de Aplicações Corporativas (DAC)",
      sigla: "DAC",
      professor: "Prof. André Cardoso",
      sala_anterior: "Sala 303 (Bloco A)",
      nova_sala: "Sala 102 (Bloco B - Térreo)",
      motivo: "O ar condicionado parou de funcionar inesperadamente e o ambiente ficou superaquecido para a aplicação da prova.",
      mapa: {
        titulo: "Localização: Bloco B - Térreo",
        cabecalho: "Como chegar na Sala 102:",
        passos: [
          "1. Saia do Bloco A pela passarela central.",
          "2. Siga em direção à recepção do Bloco B.",
          "3. A Sala 102 fica no corredor à direita, logo após a coordenação (Térreo)."
        ]
      }
    };

    function preencherTela(dados) {
      dadosAtuais = dados;
      document.getElementById('hora').innerText = `Atualizado às ${dados.atualizado_em}`;
      document.getElementById('disciplina').innerText = dados.disciplina;
      document.getElementById('professor').innerText = dados.professor;
      document.getElementById('salaAnterior').innerText = dados.sala_anterior;
      document.getElementById('novaSala').innerText = dados.nova_sala;
      document.getElementById('motivo').innerText = dados.motivo;

      if (dados.mapa) {
        document.getElementById('mapaTitulo').innerText = dados.mapa.titulo;
        document.getElementById('mapaCabecalho').innerText = dados.mapa.cabecalho;
        document.getElementById('mapaPassos').innerHTML = dados.mapa.passos.join('<br>');
      }

      verificarConfirmacaoSalva();
    }

    async function carregarBancoDeDados() {
      try {
        const resposta = await fetch('./dados.json?t=' + new Date().getTime());
        if (!resposta.ok) throw new Error('JSON não encontrado');
        const dadosJson = await resposta.json();
        preencherTela(dadosJson);
      } catch (erro) {
        preencherTela(dadosPadrao);
      }
    }

    function confirmarLeitura() {
      const chave = `ciencia_${dadosAtuais.sigla}_${dadosAtuais.atualizado_em}`;
      localStorage.setItem(chave, 'true');
      aplicarEstadoConfirmado();
    }

    function verificarConfirmacaoSalva() {
      const chave = `ciencia_${dadosAtuais.sigla}_${dadosAtuais.atualizado_em}`;
      if (localStorage.getItem(chave) === 'true') {
        aplicarEstadoConfirmado();
      }
    }

    function aplicarEstadoConfirmado() {
      const btn = document.getElementById('btnConfirmar');
      btn.classList.add('confirmed');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Ciência Confirmada`;
    }

    function copiarAviso() {
      const btn = document.getElementById('btnCopiar');
      const conteudoOriginal = btn.innerHTML;
      const texto = `⚠️ *ALTERAÇÃO DE SALA* - ${dadosAtuais.sigla} (${dadosAtuais.professor})\n❌ De: ${dadosAtuais.sala_anterior}\n✅ Para: ${dadosAtuais.nova_sala}\nMotivo: ${dadosAtuais.motivo}`;
      
      navigator.clipboard.writeText(texto);
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Aviso Copiado!`;
      setTimeout(() => {
        btn.innerHTML = conteudoOriginal;
      }, 2500);
    }

    function abrirMapa() {
      document.getElementById('modalMapa').style.display = 'flex';
    }

    function fecharMapa() {
      document.getElementById('modalMapa').style.display = 'none';
    }

    carregarBancoDeDados();
  </script>
