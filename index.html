<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRoom — Alteração de Sala</title>
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --emerald-400: #34d399;
      --emerald-500: #10b981;
      --emerald-600: #059669;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --bg-base: #070b0e;
      --card-glass: rgba(17, 25, 33, 0.72);
      --surface: rgba(255, 255, 255, 0.03);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --border-light: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.16) 0%, transparent 55%),
        radial-gradient(circle at 85% 90%, rgba(37, 99, 235, 0.1) 0%, transparent 45%);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      width: 100%;
      max-width: 720px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      overflow: hidden;
      border: 1px solid var(--border-light);
    }

    .card-header {
      background: linear-gradient(90deg, rgba(5, 150, 105, 0.9), rgba(4, 120, 87, 0.9));
      border-bottom: 1px solid rgba(52, 211, 153, 0.3);
      color: #ffffff;
      padding: 18px 28px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .card-body {
      padding: 28px 32px 36px;
    }

    .top-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .brand-tag {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--emerald-400);
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .badge-time {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border-light);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--emerald-400);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--emerald-400);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .info-group {
      text-align: center;
      margin-bottom: 30px;
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-secondary);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .disciplina {
      font-size: 1.55rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 18px;
      line-height: 1.25;
      letter-spacing: -0.02em;
    }

    .professor {
      font-size: 1.05rem;
      font-weight: 500;
      color: #cbd5e1;
    }

    .transfer-grid {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 16px;
      margin-bottom: 26px;
    }

    .room-box {
      padding: 22px 18px;
      border-radius: 16px;
      text-align: center;
    }

    .room-old {
      background: var(--surface);
      border: 1px solid var(--border-light);
      color: var(--text-secondary);
    }

    .room-old .room-name {
      text-decoration: line-through;
      opacity: 0.75;
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .room-new {
      background: linear-gradient(145deg, rgba(16, 185, 129, 0.16), rgba(5, 150, 105, 0.06));
      border: 1.5px solid var(--emerald-500);
      color: #ffffff;
      box-shadow: 0 0 30px var(--emerald-glow);
    }

    .room-new .label {
      color: var(--emerald-400);
    }

    .room-new .room-name {
      font-size: 1.32rem;
      font-weight: 800;
      margin-top: 8px;
      line-height: 1.3;
    }

    .arrow-circle {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.4);
      color: #60a5fa;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .reason-box {
      background: rgba(245, 158, 11, 0.07);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-left: 4px solid #f59e0b;
      padding: 18px 22px;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 30px;
    }

    .reason-title {
      font-weight: 700;
      color: #fbbf24;
      font-size: 0.88rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .reason-text {
      color: #fef3c7;
      font-size: 0.95rem;
      line-height: 1.55;
    }

    .actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 13px 22px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn svg {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: var(--emerald-600);
      color: #ffffff;
      border: 1px solid var(--emerald-400);
      box-shadow: 0 4px 16px var(--emerald-glow);
    }

    .btn-primary:hover {
      background: var(--emerald-500);
      transform: translateY(-2px);
    }

    .btn-primary.confirmed {
      background: #065f46;
      border-color: var(--emerald-400);
      color: #a7f3d0;
    }

    .btn-secondary {
      background: var(--surface);
      color: #e2e8f0;
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      background: var(--surface-hover);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-content {
      background: #111921;
      border: 1px solid var(--border-light);
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      padding: 28px;
      text-align: center;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 12px;
      color: var(--emerald-400);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .map-placeholder {
      background: var(--surface);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 22px;
      margin: 18px 0;
      color: #cbd5e1;
      font-size: 0.94rem;
      line-height: 1.65;
      text-align: left;
    }

    .map-placeholder strong {
      color: #ffffff;
      display: block;
      margin-bottom: 10px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .card-body { padding: 22px 20px 28px; }
      .transfer-grid { grid-template-columns: 1fr; }
      .arrow-circle { margin: 0 auto; transform: rotate(90deg); }
      .btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="card-header">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
      Alteração de Sala Imediata
    </div>

    <div class="card-body">
      <div class="top-meta">
        <span class="brand-tag">SmartRoom</span>
        <div class="badge-time">
          <span class="pulse-dot"></span>
          <span id="hora">Atualizado às 10:15</span>
        </div>
      </div>

      <div class="info-group">
        <div class="label">Disciplina</div>
        <div id="disciplina" class="disciplina">Desenvolvimento de Aplicações Corporativas (DAC)</div>
        <div class="label">Professor</div>
        <div id="professor" class="professor">Prof. André Cardoso</div>
      </div>

      <div class="transfer-grid">
        <div class="room-box room-old">
          <div class="label">Sala Anterior</div>
          <div id="salaAnterior" class="room-name">Sala 303 (Bloco A)</div>
        </div>

        <div class="arrow-circle">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </div>

        <div class="room-box room-new">
          <div class="label">Nova Sala</div>
          <div id="novaSala" class="room-name">Sala 102 (Bloco B - Térreo)</div>
        </div>
      </div>

      <div class="reason-box">
