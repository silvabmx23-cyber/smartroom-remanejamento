<script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, GoogleAuthProvider, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://gstatic.com";
    import { getDatabase, ref, set, get, onValue } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBXGRZsJc4GM-zwjaImG1Gs0LV4JlLuz0c",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "smartroom-remanejamento",
      storageBucket: "smartroom-remanejamento.firebasestorage.app",
      messagingSenderId: "465695973098",
      appId: "1:465695973098:web:f60b648cba5761f542c193",
      measurementId: "G-873M1VZ98X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const formArea = document.getElementById('form-area');
    const userStatus = document.getElementById('user-status');
    const btnSave = document.getElementById('btnSave');
    const statusMsg = document.getElementById('status');

    // Captura retorno do login na mesma aba
    getRedirectResult(auth).catch(e => {
      userStatus.innerText = "Erro ao concluir login: " + e.message;
    });

    btnLogin.onclick = () => {
      btnLogin.innerText = "Abrindo Google...";
      btnLogin.disabled = true;
      signInWithRedirect(auth, provider).catch(e => {
        btnLogin.innerText = "Entrar com Google";
        btnLogin.disabled = false;
        alert("Erro ao iniciar login: " + e.message);
      });
    };

    btnLogout.onclick = () => signOut(auth);

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        userStatus.innerText = `Conectado como: ${user.email}`;
        btnLogin.classList.add('hidden');
        btnLogout.classList.remove('hidden');
        formArea.classList.remove('hidden');
        await carregarDados();
        escutarCatalogoSalas();
      } else {
        userStatus.innerText = 'Faça login com Google para habilitar a edição pelo celular.';
        btnLogin.innerText = "Entrar com Google";
        btnLogin.disabled = false;
        btnLogin.classList.remove('hidden');
        btnLogout.classList.add('hidden');
        formArea.classList.add('hidden');
      }
    });

    async function carregarDados() {
      const d = new Date();
      document.getElementById('hora').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      try {
        const snap = await get(ref(db, 'remanejamento/atual'));
        let j = snap.exists() ? snap.val() : null;
        if (!j) {
          const r = await fetch('./dados.json');
          j = await r.json();
        }
        if (j) {
          document.getElementById('sigla').value = j.sigla || '';
          document.getElementById('disc').value = j.disciplina || '';
          document.getElementById('prof').value = j.professor || '';
          document.getElementById('ant').value = j.salaAnterior || '';
          document.getElementById('nova').value = j.novaSala || '';
          document.getElementById('motivo').value = j.motivo || '';
          document.getElementById('mTit').value = j.mapaTitulo || '';
          document.getElementById('mPassos').value = Array.isArray(j.mapaPassos) ? j.mapaPassos.join('\n') : (j.mapaPassos || '');
        }
      } catch (e) {
        console.error("Erro ao carregar dados:", e);
      }
    }

    btnSave.onclick = async () => {
      btnSave.disabled = true;
      btnSave.innerText = 'Publicando...';
      statusMsg.style.display = 'none';

      const payload = {
        horario: document.getElementById('hora').value.trim(),
        sigla: document.getElementById('sigla').value.trim(),
        disciplina: document.getElementById('disc').value.trim(),
        professor: document.getElementById('prof').value.trim(),
        salaAnterior: document.getElementById('ant').value.trim(),
        novaSala: document.getElementById('nova').value.trim(),
        motivo: document.getElementById('motivo').value.trim(),
        mapaTitulo: document.getElementById('mTit').value.trim(),
        mapaPassos: document.getElementById('mPassos').value.split('\n').map(s => s.trim()).filter(Boolean)
      };

      try {
        await set(ref(db, 'remanejamento/atual'), payload);
        statusMsg.style.display = 'block';
        statusMsg.style.background = 'rgba(16,185,129,.2)';
        statusMsg.style.color = '#34d399';
        statusMsg.innerText = 'Alteração publicada com sucesso!';
      } catch (e) {
        statusMsg.style.display = 'block';
        statusMsg.style.background = 'rgba(239,68,68,.2)';
        statusMsg.style.color = '#fca5a5';
        statusMsg.innerText = 'Erro ao salvar: verifique se seu e-mail tem permissão nas regras do Firebase.';
      } finally {
        btnSave.disabled = false;
        btnSave.innerText = 'Publicar Alteração Agora';
      }
    };

    const btnSaveSala = document.getElementById('btnSaveSala');
    const statusSala = document.getElementById('status-sala');

    btnSaveSala.onclick = async () => {
      const nome = document.getElementById('cad-nome-sala').value.trim();
      const capacidade = parseInt(document.getElementById('cad-cap-sala').value, 10);
      const ar = document.getElementById('cad-ar-sala').value;
      const proj = document.getElementById('cad-proj-sala').value;

      if (!nome || isNaN(capacidade)) {
        alert("Preencha o nome da sala e a capacidade máxima de alunos.");
        return;
      }

      btnSaveSala.disabled = true;
      btnSaveSala.innerText = 'Salvando sala...';
      statusSala.style.display = 'none';

      const salaId = nome.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "_");

      try {
        await set(ref(db, `catalogo_salas/${salaId}`), {
          nome,
          capacidade,
          ar,
          proj
        });

        document.getElementById('cad-nome-sala').value = '';
        document.getElementById('cad-cap-sala').value = '';
        statusSala.style.display = 'block';
        statusSala.style.background = 'rgba(16,185,129,.2)';
        statusSala.style.color = '#34d399';
        statusSala.innerText = `Sala "${nome}" salva no catálogo!`;
      } catch (e) {
        statusSala.style.display = 'block';
        statusSala.style.background = 'rgba(239,68,68,.2)';
        statusSala.style.color = '#fca5a5';
        statusSala.innerText = 'Erro ao salvar sala: verifique as permissões do Firebase.';
      } finally {
        btnSaveSala.disabled = false;
        btnSaveSala.innerText = 'Salvar Sala no Catálogo';
      }
    };

    function escutarCatalogoSalas() {
      const ul = document.getElementById('lista-catalogo-salas');
      onValue(ref(db, 'catalogo_salas'), (snap) => {
        ul.innerHTML = '';
        const dados = snap.val();
        if (!dados) {
          ul.innerHTML = '<li class="item-sala"><div class="item-sala-info"><small>Nenhuma sala cadastrada ainda.</small></div></li>';
          return;
        }

        Object.values(dados).sort((a, b) => a.nome.localeCompare(b.nome)).forEach((sala) => {
          const li = document.createElement('li');
          li.className = 'item-sala';
          li.title = 'Clique para usar esta sala no remanejamento';
          li.innerHTML = `
            <div class="item-sala-info">
              <strong>${sala.nome}</strong>
              <small>Ar-condicionado: ${sala.ar} • Projetor: ${sala.proj}</small>
            </div>
            <span class="badge-cap">${sala.capacidade} alunos</span>
          `;
          li.onclick = () => {
            document.getElementById('nova').value = sala.nome;
            document.getElementById('nova').scrollIntoView({ behavior: 'smooth', block: 'center' });
          };
          ul.appendChild(li);
        });
      });
    }
  </script>
