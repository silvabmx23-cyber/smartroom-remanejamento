<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRoom — Painel de Apoio</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root { --e4: #34d399; --e5: #10b981; --e6: #059669; --bg: #070b0e; --card: rgba(17,25,33,.92); --surf: rgba(255,255,255,.06); --bdr: rgba(255,255,255,.12); --txt: #f8fafc; --sec: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg) radial-gradient(circle at 50% 0%, rgba(16,185,129,.15), transparent 60%); color: var(--txt); display: flex; justify-content: center; padding: 20px 14px; min-height: 100vh; }
    .box { background: var(--card); border: 1px solid var(--bdr); border-radius: 22px; width: 100%; max-width: 580px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.7); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--bdr); }
    .top h1 { font-size: 1.2rem; font-weight: 800; color: var(--e4); }
    .top a { color: var(--sec); text-decoration: none; font-size: .84rem; font-weight: 600; }
    .fg { margin-bottom: 14px; }
    label { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--sec); font-weight: 700; margin-bottom: 5px; }
    input, textarea { width: 100%; background: var(--surf); border: 1px solid var(--bdr); border-radius: 11px; padding: 11px 13px; color: #fff; font-size: .94rem; outline: none; }
    input:focus, textarea:focus { border-color: var(--e4); }
    textarea { resize: vertical; min-height: 74px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
    .chip { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: var(--e4); padding: 6px 11px; border-radius: 20px; font-size: .77rem; font-weight: 600; cursor: pointer; }
    .chip:hover { background: var(--e6); color: #fff; }
    .tk { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.25); padding: 12px; border-radius: 12px; margin-bottom: 18px; }
    .tk label { color: #93c5fd; }
    .btn { width: 100%; background: var(--e6); color: #fff; border: 1px solid var(--e4); padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: var(--e5); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-size: .88rem; font-weight: 600; display: none; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h1>SmartRoom Apoio</h1>
      <a href="./index.html" target="_blank">Ver Site Público ➔</a>
    </div>
    <div class="tk">
      <label>Chave de Publicação (GitHub Token)</label>
      <input type="password" id="token" placeholder="github_pat_xxxxxxxxxxxx">
    </div>
    <div class="row">
      <div class="fg"><label>Horário da Atualização</label><input type="text" id="hora"></div>
      <div class="fg"><label>Sigla</label><input type="text" id="sigla"></div>
    </div>
    <div class="fg"><label>Disciplina</label><input type="text" id="disc"></div>
    <div class="fg"><label>Professor(a)</label><input type="text" id="prof"></div>
    <div class="row">
      <div class="fg"><label>Sala Anterior</label><input type="text" id="ant"></div>
      <div class="fg"><label>Nova Sala</label><input type="text" id="nova"></div>
    </div>
    <div class="fg">
      <label>Motivo Rápido (Clique para preencher)</label>
      <div class="chips">
        <button type="button" class="chip" onclick="setMotivo('O ar-condicionado apresentou defeito e a sala ficou superaquecida.')">Ar-condicionado</button>
        <button type="button" class="chip" onclick="setMotivo('A sala original já estava reservada para outra atividade acadêmica.')">Sala reservada</button>
        <button type="button" class="chip" onclick="setMotivo('O projetor e equipamentos multimídia apresentaram falha técnica.')">Projetor com defeito</button>
        <button type="button" class="chip" onclick="setMotivo('Manutenção elétrica ou estrutural emergencial na sala original.')">Manutenção</button>
      </div>
      <textarea id="motivo"></textarea>
    </div>
    <div class="fg"><label>Título do Mapa</label><input type="text" id="mTit"></div>
    <div class="fg"><label>Instruções de Como Chegar (1 por linha)</label><textarea id="mPassos"></textarea></div>
    <button type="button" id="btnSave" class="btn" onclick="publicar()">Publicar Alteração Agora</button>
    <div id="status" class="msg"></div>
  </div>
  <script>
    const API_URL = 'https://github.com';
    function setMotivo(txt) { document.getElementById('motivo').value = txt; }
    window.onload = async function() {
      const tk = localStorage.getItem('sr_tk');
      if (tk) document.getElementById('token').value = tk;
      const d = new Date();
      document.getElementById('hora').value = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      try {
        const r = await fetch('./dados.json?t=' + Date.now());
        const j = await r.json();
        document.getElementById('sigla').value = j.sigla || '';
        document.getElementById('disc').value = j.disciplina || '';
        document.getElementById('prof').value = j.professor || '';
        document.getElementById('ant').value = j.sala_anterior || '';
        document.getElementById('nova').value = j.nova_sala || '';
        document.getElementById('motivo').value = j.motivo || '';
        if (j.mapa) {
          document.getElementById('mTit').value = j.mapa.titulo || '';
          document.getElementById('mPassos').value = (j.mapa.passos || []).join('\n');
        }
      } catch (e) {}
    };
    async function publicar() {
      const tk = document.getElementById('token').value.trim();
      const st = document.getElementById('status');
      const btn = document.getElementById('btnSave');
      if (!tk) { st.style.display = 'block'; st.style.background = 'rgba(239,68,68,.15)'; st.style.color = '#f87171'; st.innerText = 'Cole o GitHub Token no campo azul acima.'; return; }
      localStorage.setItem('sr_tk', tk);
      btn.disabled = true; btn.innerText = 'Publicando...'; st.style.display = 'none';
      const payload = {
        atualizado_em: document.getElementById('hora').value,
        disciplina: document.getElementById('disc').value,
        sigla: document.getElementById('sigla').value,
        professor: document.getElementById('prof').value,
        sala_anterior: document.getElementById('ant').value,
        nova_sala: document.getElementById('nova').value,
        motivo: document.getElementById('motivo').value,
        mapa: { titulo: document.getElementById('mTit').value, passos: document.getElementById('mPassos').value.split('\n').map(x => x.trim()).filter(Boolean) }
      };
      try {
        const g = await fetch(API_URL, { headers: { Authorization: 'Bearer ' + tk } });
        if (!g.ok) throw new Error('Token inválido ou sem permissão (Erro ' + g.status + ').');
        const info = await g.json();
        const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
        const p = await fetch(API_URL, {
          method: 'PUT',
          headers: { Authorization: 'Bearer ' + tk, 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: 'Atualiza sala ' + payload.sigla, content: b64, sha: info.sha })
        });
        if (!p.ok) throw new Error('Falha ao salvar (Erro ' + p.status + ').');
        st.style.display = 'block'; st.style.background = 'rgba(16,185,129,.15)'; st.style.color = '#34d399'; st.innerText = 'Publicado com sucesso! O site dos alunos atualizará em 30 segundos.';
      } catch (err) {
        st.style.display = 'block'; st.style.background = 'rgba(239,68,68,.15)'; st.style.color = '#f87171'; st.innerText = 'Erro: ' + err.message;
      } finally { btn.disabled = false; btn.innerText = 'Publicar Alteração Agora'; }
    }
  </script>
</body>
</html>
