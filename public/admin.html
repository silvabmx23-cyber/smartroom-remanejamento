   <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRoom — Painel de Apoio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #070b0e; color: #f8fafc; display: flex; justify-content: center; padding: 20px 14px; }
    .box { background: #111921; border: 1px solid #26323d; border-radius: 18px; width: 100%; max-width: 580px; padding: 22px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #26323d; }
    .top h1 { font-size: 1.2rem; color: #34d399; }
    .top a { color: #94a3b8; text-decoration: none; font-size: .85rem; }
    .login-card { background: #0b1117; border: 1px solid #26323d; padding: 18px; border-radius: 14px; margin-bottom: 16px; }
    .user-bar { background: #0d2e24; border: 1px solid #10b981; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: #34d399; }
    .btn-sair { background: #451a1a; color: #fca5a5; border: 1px solid #7f1d1d; padding: 6px 12px; border-radius: 7px; font-weight: 700; cursor: pointer; }
    .fg { margin-bottom: 12px; }
    label { display: block; font-size: .72rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; }
    input, textarea, select { width: 100%; background: #0b1117; border: 1px solid #26323d; border-radius: 10px; padding: 11px 12px; color: #fff; font-size: .94rem; }
    .login-card input { background: #111921; }
    textarea { min-height: 70px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .chip { background: #0d2e24; border: 1px solid #10b981; color: #34d399; padding: 5px 10px; border-radius: 16px; font-size: .75rem; cursor: pointer; }
    .btn { width: 100%; background: #059669; color: #fff; border: 1px solid #34d399; padding: 13px; border-radius: 11px; font-size: .98rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sec { background: #1e293b; border-color: #475569; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; font-size: .86rem; font-weight: 600; display: none; }
    .hidden { display: none !important; }
    .secao { margin-top: 24px; padding-top: 20px; border-top: 1px solid #26323d; }
    .secao h2 { font-size: 1.05rem; color: #34d399; margin-bottom: 4px; }
    .secao p { font-size: .8rem; color: #94a3b8; margin-bottom: 12px; }
    .lista { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .item { background: #0b1117; border: 1px solid #26323d; border-radius: 10px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .item:hover { border-color: #34d399; }
    .badge { background: #0d2e24; color: #34d399; padding: 4px 8px; border-radius: 6px; font-size: .78rem; font-weight: 700; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h1>SmartRoom Apoio</h1>
      <a href="./index.html" target="_blank">Ver Site Público ➔</a>
    </div>

    <div id="login-box" class="login-card">
      <div class="fg"><label>E-mail do Apoio ou Professor</label><input type="email" id="login-email" placeholder="apoio@unifametro.edu.br"></div>
      <div class="fg"><label>Senha</label><input type="password" id="login-senha" placeholder="••••••••"></div>
      <button type="button" id="btn-login" class="btn">Entrar no Painel</button>
      <div id="login-erro" class="msg" style="color:#fca5a5;background:#451a1a;"></div>
    </div>

    <div id="user-bar" class="user-bar hidden">
      <span id="user-email">Conectado</span>
      <button type="button" id="btn-logout" class="btn-sair">Sair</button>
    </div>

    <div id="form-area" class="hidden">
      <div class="row">
        <div class="fg"><label>Horário</label><input type="text" id="hora" placeholder="Ex: 19:00 - 21:40"></div>
        <div class="fg"><label>Sigla</label><input type="text" id="sigla" placeholder="Ex: ADS01"></div>
      </div>
      <div class="fg"><label>Disciplina</label><input type="text" id="disc" placeholder="Nome da disciplina"></div>
      <div class="fg"><label>Professor(a)</label><input type="text" id="prof" placeholder="Nome do professor"></div>
      <div class="row">
        <div class="fg"><label>Sala Anterior</label><input type="text" id="ant" placeholder="Ex: Sala 101"></div>
        <div class="fg"><label>Nova Sala (ou clique abaixo)</label><input type="text" id="nova" placeholder="Ex: Sala 204"></div>
      </div>
      <div class="fg">
        <label>Motivo Rápido</label>
        <div class="chips">
          <button type="button" class="chip" onclick="document.getElementById('motivo').value='O ar-condicionado apresentou defeito.'">Ar-condicionado</button>
          <button type="button" class="chip" onclick="document.getElementById('motivo').value='A sala original não comporta a quantidade de alunos.'">Lotação / Capacidade</button>
          <button type="button" class="chip" onclick="document.getElementById('motivo').value='O projetor apresentou falha técnica.'">Projetor com defeito</button>
        </div>
        <textarea id="motivo" placeholder="Descreva o motivo do remanejamento"></textarea>
      </div>
      <div class="fg"><label>Título do Mapa</label><input type="text" id="mTit" placeholder="Ex: Como chegar na Sala 204"></div>
      <div class="fg"><label>Como Chegar (1 passo por linha)</label><textarea id="mPassos" placeholder="Suba as escadas do Bloco B&#10;Vire à esquerda no corredor"></textarea></div>
      <button type="button" id="btnSave" class="btn">Publicar Alteração Agora</button>
      <div id="status" class="msg"></div>

      <div class="secao">
        <h2>Catálogo de Salas e Capacidade</h2>
        <p>Cadastre a capacidade e recursos. Clique em uma sala abaixo para preencher a Nova Sala.</p>
        <div class="fg"><label>Nome da Sala</label><input type="text" id="cad-nome" placeholder="Ex: Sala 102 - Bloco B"></div>
        <div class="row">
          <div class="fg"><label>Capacidade (Alunos)</label><input type="number" id="cad-cap" placeholder="Ex: 55"></div>
          <div class="fg"><label>Ar-condicionado</label><select id="cad-ar"><option value="OK">OK</option><option value="Defeito">Defeito</option></select></div>
        </div>
        <div class="fg"><label>Projetor</label><select id="cad-proj"><option value="OK">OK</option><option value="Defeito">Defeito</option></select></div>
        <button type="button" id="btnSaveSala" class="btn btn-sec">Salvar Sala no Catálogo</button>
        <div id="status-sala" class="msg"></div>
        <ul id="lista-salas" class="lista"></ul>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://gstatic.com";
    import { getDatabase, ref, push, set, onValue } from "https://gstatic.com";

    const firebaseConfig = {
      apiKey: "AIzaSyBXGRZsJc4GM-zwjaImG1Gs0LV4JlLuz0c",
      authDomain: "://firebaseapp.com",
      databaseURL: "https://firebaseio.com",
      projectId: "smartroom-remanejamento",
      storageBucket: "smartroom-remanejamento.firebasestorage.app",
      messagingSenderId: "465695973098",
      appId: "1:465695973098:web:f60b648cba5761f542c193",
      measurementId: "G-873M1VZ98X"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginBox = document.getElementById('login-box');
    const userBar = document.getElementById('user-bar');
    const userEmailSpan = document.getElementById('user-email');
    const formArea = document.getElementById('form-area');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const loginErro = document.getElementById('login-erro');

    function mostrarMensagem(el, texto, sucesso = true) {
      el.textContent = texto;
      el.style.display = 'block';
      el.style.color = sucesso ? '#34d399' : '#fca5a5';
      el.style.background = sucesso ? '#0d2e24' : '#451a1a';
    }

    // Monitora estado de login
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBox.classList.add('hidden');
        userBar.classList.remove('hidden');
        formArea.classList.remove('hidden');
        userEmailSpan.textContent = `Conectado: ${user.email}`;
      } else {
        loginBox.classList.remove('hidden');
        userBar.classList.add('hidden');
        formArea.classList.add('hidden');
      }
    });

    // Evento de Login
    btnLogin.onclick = async () => {
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;
      loginErro.style.display = 'none';

      if (!email || !senha) {
        mostrarMensagem(loginErro, 'Preencha o e-mail e a senha.', false);
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';

      try {
        await signInWithEmailAndPassword(auth, email, senha);
      } catch (err) {
        mostrarMensagem(loginErro, 'E-mail ou senha inválidos, ou usuário não cadastrado.', false);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar no Painel';
      }
    };
// Permitir apertar Enter no campo de senha
document.getElementById('login-senha').addEventListener('keypress', (e) => {
if (e.key === 'Enter') btnLogin.click();
});
// Evento de Logout
btnLogout.onclick = () => signOut(auth);
// Publicar Remanejamento
const btnSave = document.getElementById('btnSave');
const statusMsg = document.getElementById('status');
btnSave.onclick = async () => {
const dados = {
hora: document.getElementById('hora').value.trim(),
sigla: document.getElementById('sigla').value.trim(),
disc: document.getElementById('disc').value.trim(),
prof: document.getElementById('prof').value.trim(),
ant: document.getElementById('ant').value.trim(),
nova: document.getElementById('nova').value.trim(),
motivo: document.getElementById('motivo').value.trim(),
mTit: document.getElementById('mTit').value.trim(),
mPassos: document.getElementById('mPassos').value.trim().split('\n').filter(p => p.trim() !== ''),
criadoEm: Date.now()
};
if (!dados.disc || !dados.nova) {
mostrarMensagem(statusMsg, 'Preencha pelo menos a Disciplina e a Nova Sala.', false);
return;
}
btnSave.disabled = true;
btnSave.textContent = 'Publicando...';
try {
await push(ref(db, 'remanejamentos'), dados);
mostrarMensagem(statusMsg, 'Alteração publicada com sucesso!', true);
['hora', 'sigla', 'disc', 'prof', 'ant', 'nova', 'motivo', 'mTit', 'mPassos'].forEach(id => {
document.getElementById(id).value = '';
});
} catch (err) {
mostrarMensagem(statusMsg, 'Erro ao salvar no banco de dados.', false);
} finally {
btnSave.disabled = false;
btnSave.textContent = 'Publicar Alteração Agora';
}
};
// Salvar Sala no Catálogo
const btnSaveSala = document.getElementById('btnSaveSala');
const statusSala = document.getElementById('status-sala');
btnSaveSala.onclick = async () => {
const nome = document.getElementById('cad-nome').value.trim();
const cap = document.getElementById('cad-cap').value.trim();
const ar = document.getElementById('cad-ar').value;
const proj = document.getElementById('cad-proj').value;
if (!nome) {
mostrarMensagem(statusSala, 'Informe o nome da sala.', false);
return;
}
btnSaveSala.disabled = true;
try {
await push(ref(db, 'salas'), { nome, cap, ar, proj });
mostrarMensagem(statusSala, 'Sala salva no catálogo!', true);
document.getElementById('cad-nome').value = '';
document.getElementById('cad-cap').value = '';
} catch (err) {
mostrarMensagem(statusSala, 'Erro ao salvar sala.', false);
} finally {
btnSaveSala.disabled = false;
}
};
// Listar Salas do Catálogo
const listaSalas = document.getElementById('lista-salas');
onValue(ref(db, 'salas'), (snapshot) => {
listaSalas.innerHTML = '';
const data = snapshot.val();
if (!data) return;
Object.values(data).forEach((sala) => {
const li = document.createElement('li');
li.className = 'item';
li.innerHTML = <div> <strong>${sala.nome}</strong><br> <small style="color:#94a3b8;">Ar: ${sala.ar} | Projetor: ${sala.proj}</small> </div> <span class="badge">${sala.cap ? sala.cap + ' lug.' : 'Sala'}</span>;
li.onclick = () => {
document.getElementById('nova').value = sala.nome;
window.scrollTo({ top: 0, behavior: 'smooth' });
};
listaSalas.appendChild(li);
});
});
