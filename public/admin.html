<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartRoom — Painel de Apoio</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root { --e4: #34d399; --e5: #10b981; --e6: #059669; --bg: #070b0e; --card: rgba(17,25,33,.92); --surf: rgba(255,255,255,.06); --bdr: rgba(255,255,255,.12); --txt: #f8fafc; --sec: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg) radial-gradient(circle at 50% 0%, rgba(16,185,129,.15), transparent 60%); color: var(--txt); display: flex; justify-content: center; padding: 20px 14px; min-height: 100vh; }
    .box { background: var(--card); border: 1px solid var(--bdr); border-radius: 22px; width: 100%; max-width: 580px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0,0,0,.7); }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--bdr); }
    .top h1 { font-size: 1.2rem; font-weight: 800; color: var(--e4); }
    .top a { color: var(--sec); text-decoration: none; font-size: .84rem; font-weight: 600; }
    .fg { margin-bottom: 14px; }
    label { display: block; font-size: .74rem; text-transform: uppercase; letter-spacing: .07em; color: var(--sec); font-weight: 700; margin-bottom: 5px; }
    input, textarea, select { width: 100%; background: var(--surf); border: 1px solid var(--bdr); border-radius: 11px; padding: 11px 13px; color: #fff; font-size: .94rem; outline: none; }
    select option { background: #111921; color: #fff; }
    input:focus, textarea:focus, select:focus { border-color: var(--e4); }
    textarea { resize: vertical; min-height: 74px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 9px; }
    .chip { background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.3); color: var(--e4); padding: 6px 11px; border-radius: 20px; font-size: .77rem; font-weight: 600; cursor: pointer; }
    .chip:hover { background: var(--e6); color: #fff; }
    .auth-box { background: rgba(59,130,246,.08); border: 1px solid rgba(59,130,246,.25); padding: 14px; border-radius: 12px; margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .auth-info { font-size: .82rem; color: #93c5fd; }
    .btn-auth { background: #ffffff; color: #0f172a; border: none; padding: 9px 14px; border-radius: 8px; font-size: .82rem; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .btn-sair { background: rgba(239,68,68,.2); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
    .btn { width: 100%; background: var(--e6); color: #fff; border: 1px solid var(--e4); padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; margin-top: 6px; }
    .btn:hover { background: var(--e5); }
    .btn:disabled { opacity: .6; cursor: not-allowed; }
    .btn-sec { background: rgba(255,255,255,.08); border: 1px solid var(--bdr); }
    .btn-sec:hover { background: rgba(255,255,255,.15); }
    .msg { margin-top: 14px; padding: 12px; border-radius: 10px; text-align: center; font-size: .88rem; font-weight: 600; display: none; }
    .hidden { display: none !important; }
    .secao-salas { margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--bdr); }
    .secao-salas h2 { font-size: 1.05rem; font-weight: 800; color: var(--e4); margin-bottom: 4px; }
    .secao-salas p { font-size: .8rem; color: var(--sec); margin-bottom: 14px; }
    .lista-salas { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
    .item-sala { background: var(--surf); border: 1px solid var(--bdr); border-radius: 12px; padding: 11px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; transition: border-color .2s; }
    .item-sala:hover { border-color: var(--e4); }
    .item-sala-info strong { font-size: .9rem; color: #fff; display: block; }
    .item-sala-info small { font-size: .76rem; color: var(--sec); }
    .badge-cap { background: rgba(16,185,129,.15); color: var(--e4); border: 1px solid rgba(16,185,129,.3); padding: 4px 9px; border-radius: 8px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
    @media (max-width: 500px) { .row { grid-template-columns: 1fr; } .auth-box { flex-direction: column; text-align: center; } }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h1>SmartRoom Apoio</h1>
      <a href="./index.html" target="_blank">Ver Site Público ➔</a>
    </div>

    <div class="auth-box">
      <div class="auth-info" id="user-status">Faça login com Google para habilitar a edição pelo celular.</div>
      <button type="button" id="btn-login" class="btn-auth">Entrar com Google</button>
      <button type="button" id="btn-logout" class="btn-auth btn-sair hidden">Sair</button>
    </div>

    <div id="form-area" class="hidden">
      <div class="row">
        <div class="fg"><label>Horário da Atualização</label><input type="text" id="hora"></div>
        <div class="fg"><label>Sigla</label><input type="text" id="sigla"></div>
      </div>
      <div class="fg"><label>Disciplina</label><input type="text" id="disc"></div>
      <div class="fg"><label>Professor(a)</label><input type="text" id="prof"></div>
      <div class="row">
        <div class="fg"><label>Sala Anterior</label><input type="text" id="ant"></div>
        <div class="fg"><label>Nova Sala (ou clique abaixo)</label><input type="text" id="nova"></div>
      </div>
      <div class="fg">
        <label>Motivo Rápido (Clique para preencher)</label>
        <div class="chips">
          <button type="button" class="chip" onclick="setMotivo('O ar-condicionado apresentou defeito e a sala ficou superaquecida.')">Ar-condicionado</button>
          <button type="button" class="chip" onclick="setMotivo('A sala original não comporta a quantidade de alunos da turma.')">Lotação / Capacidade</button>
          <button type="button" class="chip" onclick="setMotivo('O projetor e equipamentos multimídia apresentaram falha técnica.')">Projetor com defeito</button>
          <button type="button" class="chip" onclick="setMotivo('A sala original já estava reservada para outra atividade acadêmica.')">Sala reservada</button>
        </div>
        <textarea id="motivo"></textarea>
      </div>
      <div class="fg"><label>Título do Mapa</label><input type="text" id="mTit"></div>
      <div class="fg"><label>Instruções de Como Chegar (1 por linha)</label><textarea id="mPassos"></textarea></div>
      <button type="button" id="btnSave" class="btn">Publicar Alteração Agora</button>
      <div id="status" class="msg"></div>

      <div class="secao-salas">
        <h2>Catálogo de Salas e Capacidade</h2>
        <p>Cadastre a capacidade máxima e estrutura das salas. Clique em uma sala listada para selecioná-la como Nova Sala.</p>
        
        <div class="fg">
          <label>Identificação da Sala (Ex: Sala 102 - Bloco B)</label>
          <input type="text" id="cad-nome-sala" placeholder="Ex: Sala 204 - Bloco A">
        </div>
        
        <div class="row">
          <div class="fg">
            <label>Capacidade Máxima (Alunos)</label>
            <input type="number" id="cad-cap-sala" min="1" max="500" placeholder="Ex: 55">
          </div>
          <div class="fg">
            <label>Ar-condicionado</label>
            <select id="cad-ar-sala">
              <option value="OK">Funcionando OK</option>
              <option value="Com Defeito">Com Defeito</option>
            </select>
          </div>
        </div>

        <div class="fg">
          <label>Projetor Multimídia</label>
          <select id="cad-proj-sala">
            <option value="OK">Funcionando OK</option>
            <option value="Com Defeito">Com Defeito / Sem Projetor</option>
          </select>
        </div>

        <button type="button" id="btnSaveSala" class="btn btn-sec">Salvar Sala no Catálogo</button>
        <div id="status-sala" class="msg"></div>

        <ul id="lista-catalogo-salas" class="lista-salas">
          <li class="item-sala"><div class="item-sala-info"><small>Carregando salas cadastradas...</small></div></li>
        </ul>
      </div>
    </div>
  </div>

  <script>
    function setMotivo(txt) { document.getElementById('motivo').value = txt; }
  </script>

  <script type="module">

    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const formArea = document.getElementById('form-area');
    const userStatus = document.getElementById('user-status');
    const btnSave = document.getElementById('btnSave');
