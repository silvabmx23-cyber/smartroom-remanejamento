 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRoom — Painel de Apoio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #0f0b0e; color: #f8fafc; display: flex; justify-content: center; padding: 20px 14px; }
    .box { background: #111827; border: 1px solid #26323d; border-radius: 18px; width: 100%; max-width: 620px; padding: 22px; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #26323d; }
    .top h1 { font-size: 1.2rem; color: #34d399; }
    .top a { color: #94a3b8; text-decoration: none; font-size: .85rem; }
    .login-card { background: #0b1117; border: 1px solid #26323d; padding: 18px; border-radius: 14px; margin-bottom: 16px; }
    .user-bar { background: #0d2e24; border: 1px solid #10b981; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; font-size: .85rem; }
    .btn-sair { background: #451a1a; color: #fca5a5; border: 1px solid #ef4444; padding: 6px 12px; border-radius: 7px; font-weight: 600; cursor: pointer; }
    .fg { margin-bottom: 12px; }
    label { display: block; font-size: .72rem; text-transform: uppercase; color: #94a3b8; font-weight: 700; margin-bottom: 4px; }
    input, textarea, select { width: 100%; background: #0b1117; border: 1px solid #26323d; border-radius: 10px; padding: 11px 12px; color: #f8fafc; font-size: .92rem; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #34d399; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn { width: 100%; background: #059669; color: #fff; border: 1px solid #34d399; padding: 13px; border-radius: 11px; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 4px; }
    .btn:hover { background: #047857; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sec { background: #1e293b; border-color: #475569; margin-top: 8px; }
    .btn-del { background: #451a1a; color: #fca5a5; border: 1px solid #ef4444; padding: 5px 10px; border-radius: 6px; font-size: .75rem; font-weight: 600; cursor: pointer; }
    .msg { margin-top: 12px; padding: 10px; border-radius: 8px; text-align: center; font-size: .86rem; font-weight: 600; display: none; }
    .msg.ok { display: block; background: #064e3b; color: #6ee7b7; border: 1px solid #10b981; }
    .msg.err { display: block; background: #450a0a; color: #fca5a5; border: 1px solid #ef4444; }
    .hidden { display: none !important; }
    .secao { margin-top: 24px; padding-top: 20px; border-top: 1px solid #26323d; }
    .secao h2 { font-size: 1.05rem; color: #34d399; margin-bottom: 4px; }
    .secao p { font-size: .8rem; color: #94a3b8; margin-bottom: 12px; }
    .lista { list-style: none; display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
    .item { background: #0b1117; border: 1px solid #26323d; border-radius: 10px; padding: 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: .86rem; }
    .badge { display: inline-block; background: rgba(52, 211, 153, 0.15); color: #34d399; padding: 2px 7px; border-radius: 6px; font-size: .72rem; font-weight: 700; margin-bottom: 3px; }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <h1>SmartRoom — Painel de Apoio</h1>
      <a href="./alunos.html">← Ver Tela Alunos</a>
    </div>

    <div id="login-box" class="login-card">
      <div class="fg">
        <label for="login-email">E-mail Institucional (Apoio / Professor)</label>
        <input type="email" id="login-email" placeholder="apoio@unifametro.edu.br" required />
      </div>
      <div class="fg">
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" required />
      </div>
      <button type="button" id="btn-login" class="btn">Entrar no Painel</button>
      <div id="login-erro" class="msg"></div>
    </div>

    <div id="form-area" class="hidden">
      <div class="user-bar">
        <span>Logado como: <strong id="user-email"></strong></span>
        <button type="button" id="btn-logout" class="btn-sair">Sair</button>
      </div>

      <h2 style="font-size: 1.05rem; color: #34d399; margin-bottom: 12px;">Publicar Remanejamento de Sala</h2>

      <div class="row">
        <div class="fg">
          <label for="campus">Campus / Unidade</label>
          <select id="campus">
            <option value="Carneiro da Cunha">Campus Carneiro da Cunha</option>
            <option value="Bezerra de Menezes">Campus Bezerra de Menezes</option>
            <option value="Conselheiro Estelita">Campus Conselheiro Estelita</option>
            <option value="Maracanaú">Campus Maracanaú</option>
          </select>
        </div>
        <div class="fg">
          <label for="hora">Horário</label>
          <input type="text" id="hora" placeholder="Ex: 19:00 - 21:40" />
        </div>
      </div>

      <div class="row">
        <div class="fg">
          <label for="sigla">Sigla / Turma</label>
          <input type="text" id="sigla" placeholder="Ex: ADS-4N" />
        </div>
        <div class="fg">
          <label for="disc">Disciplina</label>
          <input type="text" id="disc" placeholder="Ex: Engenharia de Software" />
        </div>
      </div>

      <div class="row">
        <div class="fg">
          <label for="prof">Professor(a)</label>
          <input type="text" id="prof" placeholder="Nome do docente" />
        </div>
        <div class="fg">
          <label for="emailsDestino">E-mails p/ Notificar (Opcional)</label>
          <input type="text" id="emailsDestino" placeholder="prof@unifametro.edu.br, turma@..." />
        </div>
      </div>

      <div class="row">
        <div class="fg">
          <label for="ant">Sala Anterior</label>
          <input type="text" id="ant" placeholder="Ex: Bloco B - Sala 204" />
        </div>
        <div class="fg">
          <label for="nova">Nova Sala</label>
          <select id="nova">
            <option value="">Selecione uma sala do catálogo...</option>
          </select>
        </div>
      </div>

      <div class="fg">
        <label for="motivo">Motivo da Alteração</label>
        <select id="motivo">
          <option value="Ar-condicionado com defeito">Ar-condicionado com defeito</option>
          <option value="Projetor / Equipamento indisponível">Projetor / Equipamento indisponível</option>
          <option value="Lotação máxima / Capacidade da sala">Lotação máxima / Capacidade da sala</option>
          <option value="Sala reservada para evento">Sala reservada para evento</option>
          <option value="Manutenção elétrica / estrutural">Manutenção elétrica / estrutural</option>
        </select>
      </div>

      <div class="row">
        <div class="fg">
          <label for="mTit">Título do Aviso (Opcional)</label>
          <input type="text" id="mTit" placeholder="Ex: Atenção Turma!" />
        </div>
        <div class="fg">
          <label for="mPassos">Instrução Extra (Opcional)</label>
          <input type="text" id="mPassos" placeholder="Ex: Subir pelo elevador B" />
        </div>
      </div>

      <button type="button" id="btnSave" class="btn">Publicar Alteração e Notificar</button>
      <div id="statusMsg" class="msg"></div>

      <div class="secao">
        <h2>Remanejamentos Ativos no Momento</h2>
        <p>Encerre ou exclua avisos antigos quando a aula terminar.</p>
        <ul id="lista-remanejamentos" class="lista"></ul>
      </div>

      <div class="secao">
        <h2>Catálogo de Salas Disponíveis</h2>
        <p>Cadastre as salas da instituição para aparecerem na lista de destino acima.</p>

        <div class="row">
          <div class="fg">
            <label for="cad-nome">Nome / Número da Sala</label>
            <input type="text" id="cad-nome" placeholder="Ex: Lab 03 - Bloco A" />
          </div>
          <div class="fg">
            <label for="cad-cap">Capacidade (Alunos)</label>
            <input type="number" id="cad-cap" placeholder="Ex: 45" />
          </div>
        </div>

        <div class="row">
          <div class="fg">
            <label for="cad-ar">Ar-Condicionado</label>
            <select id="cad-ar">
              <option value="OK">Funcionando (OK)</option>
              <option value="Defeito">Em Manutenção</option>
            </select>
          </div>
          <div class="fg">
            <label for="cad-proj">Projetor / TV</label>
            <select id="cad-proj">
              <option value="OK">Funcionando (OK)</option>
              <option value="Sem Projetor">Sem Projetor</option>
            </select>
          </div>
        </div>

        <button type="button" id="btnSaveSala" class="btn btn-sec">+ Adicionar Sala ao Catálogo</button>
        <div id="status-sala" class="msg"></div>

        <ul id="lista-salas" class="lista"></ul>
      </div>
    </div>
  </div>
    <script>
    const s = document.createElement('script');
    s.src = "https://cdn.jsdelivr." + "net/npm/@emailjs/browser@4/dist/email.min.js";
    document.head.appendChild(s);
  </script>

  <script type="module">
    const cdn = "https://www.gstatic." + "com/firebasejs/13.4.0/";
    const { initializeApp } = await import(cdn + "firebase-app.js");
    const { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } = await import(cdn + "firebase-auth.js");
    const { getDatabase, ref, push, onValue, remove } = await import(cdn + "firebase-database.js");

    const EMAILJS_PUBLIC_KEY = "z_e7XUJmQyIudWtwB";
    const EMAILJS_SERVICE_ID = "service_6sa8w0i";
    const EMAILJS_TEMPLATE_ID = "template_7n6wliw";

    if (window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }
        const firebaseConfig = {
      apiKey: "AIzaSyBXGRZaJc4GM-zWjaImG1Ga0lV4J1Luz0c",
      authDomain: "smartroom-remanejamento" + ".firebaseapp.com",
      databaseURL: "https://" + "smartroom-remanejamento-default-rtdb" + ".firebaseio.com",
      projectId: "smartroom-remanejamento",
      storageBucket: "smartroom-remanejamento.firebasestorage.app",
      messagingSenderId: "465695973898",
      appId: "1:465695973898:web:f60b648cbe5761f542c193",
      measurementId: "G-873M1VZ98X"
    };

   const app = initializeApp(firebaseConfig);
   const auth = getAuth(app);
   const db = getDatabase(app);

    const loginBox = document.getElementById('login-box');
    const formArea = document.getElementById('form-area');
    const userEmailSpan = document.getElementById('user-email');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const loginErro = document.getElementById('login-erro');
    const btnSave = document.getElementById('btnSave');
    const statusMsg = document.getElementById('statusMsg');
    const btnSaveSala = document.getElementById('btnSaveSala');
    const statusSala = document.getElementById('status-sala');
    const listaSalas = document.getElementById('lista-salas');
    const listaRemanejamentos = document.getElementById('lista-remanejamentos');
    const selectNovaSala = document.getElementById('nova');

    function mostrarMensagem(el, texto, sucesso = true) {
      el.textContent = texto;
      el.className = 'msg ' + (sucesso ? 'ok' : 'err');
    }

    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBox.classList.add('hidden');
        formArea.classList.remove('hidden');
        userEmailSpan.textContent = user.email;
        carregarCatalogoSalas();
        carregarRemanejamentosAtivos();
      } else {
        loginBox.classList.remove('hidden');
        formArea.classList.add('hidden');
        userEmailSpan.textContent = '';
      }
    });

    btnLogin.onclick = async (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const senha = document.getElementById('login-senha').value;

      if (!email || !senha) {
        mostrarMensagem(loginErro, 'Preencha e-mail e senha.', false);
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = 'Entrando...';
      loginErro.className = 'msg';

      try {
        await signInWithEmailAndPassword(auth, email, senha);
      } catch (err) {
        mostrarMensagem(loginErro, 'Erro ao entrar: ' + err.code, false);
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = 'Entrar no Painel';
      }
    };

    btnLogout.onclick = () => signOut(auth);

    btnSave.onclick = async () => {
      const emailsTexto = document.getElementById('emailsDestino').value.trim();
      const dados = {
        campus: document.getElementById('campus').value,
        hora: document.getElementById('hora').value.trim(),
        sigla: document.getElementById('sigla').value.trim(),
        disc: document.getElementById('disc').value.trim(),
        prof: document.getElementById('prof').value.trim(),
        ant: document.getElementById('ant').value.trim(),
        nova: document.getElementById('nova').value,
        motivo: document.getElementById('motivo').value,
        mTit: document.getElementById('mTit').value.trim(),
        mPassos: document.getElementById('mPassos').value.trim(),
        confirmados: 0,
        criadoEm: Date.now()
      };

      if (!dados.disc || !dados.ant || !dados.nova) {
        mostrarMensagem(statusMsg, 'Preencha disciplina, sala anterior e nova sala.', false);
        return;
      }

      btnSave.disabled = true;
      btnSave.textContent = 'Publicando...';

      try {
        await push(ref(db, 'remanejamentos'), dados);

        let avisoExtra = '';
                if (emailsTexto && window.emailjs) {
          const listaEmails = emailsTexto.split(/[\s,;]+/).map(e => e.trim()).filter(Boolean);
          for (const dest of listaEmails) {
            await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
              to_email: dest,
              campus: dados.campus,
              disciplina: dados.disc,
              professor: dados.prof || 'Não informado',
              horario: dados.hora || 'Agora',
              sala_anterior: dados.ant,
              nova_sala: dados.nova,
              motivo: dados.motivo,
              link_painel: "https://github.io"
            });
          }
          avisoExtra = ` e e-mail enviado para ${listaEmails.length} destinatário(s)!`;
        }

        mostrarMensagem(statusMsg, 'Alteração publicada com sucesso' + avisoExtra, true);
        ['hora', 'sigla', 'disc', 'prof', 'emailsDestino', 'ant', 'eTit', 'ePassos', 'nova'].forEach(id => {
          const el = document.getElementById(id);
          if (el) el.value = '';
        });
      } catch (err) {
        console.error(err);
        mostrarMensagem(statusMsg, 'Erro ao publicar: ' + (err.text || err.message || String(err)), false);
      } finally {
        btnSave.disabled = false;
        btnSave.textContent = 'Publicar Alteração e Notificar';
      }

    };

    function carregarRemanejamentosAtivos() {
      onValue(ref(db, 'remanejamentos'), (snapshot) => {
        listaRemanejamentos.innerHTML = '';
        const data = snapshot.val();
        if (!data) {
          listaRemanejamentos.innerHTML = '<li class="item" style="color:#64748b;">Nenhum remanejamento ativo no momento.</li>';
          return;
        }

        Object.entries(data).reverse().forEach(([key, item]) => {
          const li = document.createElement('li');
          li.className = 'item';
          li.innerHTML = `
            <div>
              <span class="badge">${item.campus || 'Geral'}</span>
              <div><strong>${item.disc}</strong> (${item.sigla || 'Turma'})</div>
              <small style="color:#94a3b8;">${item.ant} ➔ <strong style="color:#34d399;">${item.nova}</strong> • ${item.confirmados || 0} ciente(s)</small>
            </div>
          `;

          const btnDel = document.createElement('button');
          btnDel.className = 'btn-del';
          btnDel.textContent = 'Encerrar';
          btnDel.onclick = () => remove(ref(db, 'remanejamentos/' + key));

          li.appendChild(btnDel);
          listaRemanejamentos.appendChild(li);
        });
      });
    }

    btnSaveSala.onclick = async () => {
      const nome = document.getElementById('cad-nome').value.trim();
      const cap = document.getElementById('cad-cap').value.trim();
      const ar = document.getElementById('cad-ar').value;
      const proj = document.getElementById('cad-proj').value;

      if (!nome) {
        mostrarMensagem(statusSala, 'Informe o nome da sala.', false);
        return;
      }

      btnSaveSala.disabled = true;
      try {
        await push(ref(db, 'salas'), { nome, cap: cap || 'N/I', ar, proj });
        mostrarMensagem(statusSala, 'Sala salva no catálogo!', true);
        document.getElementById('cad-nome').value = '';
        document.getElementById('cad-cap').value = '';
      } catch (err) {
        mostrarMensagem(statusSala, 'Erro ao salvar sala.', false);
      } finally {
        btnSaveSala.disabled = false;
      }
    };

    function carregarCatalogoSalas() {
      onValue(ref(db, 'salas'), (snapshot) => {
        listaSalas.innerHTML = '';
        selectNovaSala.innerHTML = '<option value="">Selecione uma sala do catálogo...</option>';
        const data = snapshot.val();
        if (!data) return;

        Object.entries(data).forEach(([key, sala]) => {
          const li = document.createElement('li');
          li.className = 'item';
          li.innerHTML = `<div><strong>${sala.nome}</strong> (Cap: ${sala.cap})<br><small style="color:#94a3b8;">Ar: ${sala.ar} | Projetor: ${sala.proj}</small></div>`;

          const btnDel = document.createElement('button');
          btnDel.className = 'btn-del';
          btnDel.textContent = 'Excluir';
          btnDel.onclick = () => remove(ref(db, 'salas/' + key));

          li.appendChild(btnDel);
          listaSalas.appendChild(li);

          const opt = document.createElement('option');
          opt.value = sala.nome;
          opt.textContent = `${sala.nome} (Cap: ${sala.cap} | Ar: ${sala.ar})`;
          selectNovaSala.appendChild(opt);
        });
      });
    }
  </script>
</body>
</html>
