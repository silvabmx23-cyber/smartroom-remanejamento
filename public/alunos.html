<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartRoom — Alteração de Salas em Tempo Real</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top, #0f2922 0%, #091316 55%, #050a0c 100%);
      color: #e2e8f0;
      min-height: 100vh;
      padding: 20px 14px 40px;
    }
    .container { max-width: 780px; margin: 0 auto; }
    .top-bar {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: 14px;
      padding: 16px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .brand { font-size: 1.15rem; font-weight: 700; color: #10b981; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    select, .btn-top {
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-notif {
      background: rgba(16, 185, 129, 0.15);
      border-color: #10b981;
      color: #34d399;
      font-weight: 600;
    }
    .btn-notif.ativo { background: #059669; color: #ffffff; }
    .toast-alert {
      display: none;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      padding: 14px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
    }
    .status-box {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid #1e293b;
      border-radius: 14px;
      padding: 28px;
      text-align: center;
      color: #94a3b8;
    }
    .card {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.3);
      border-left: 5px solid #10b981;
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }
    .badge-campus {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
    }
    .hora { font-size: 0.85rem; color: #94a3b8; }
    .disc-titulo { font-size: 1.2rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
    .prof-sub { font-size: 0.9rem; color: #94a3b8; margin-bottom: 14px; }
    .salas-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .sala-box { padding: 12px; border-radius: 10px; background: #0b1220; border: 1px solid #1e293b; }
    .sala-box.nova { background: rgba(16, 185, 129, 0.12); border-color: #10b981; }
    .sala-label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; margin-bottom: 4px; }
    .sala-valor { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
    .sala-box.nova .sala-valor { color: #34d399; }
    .motivo-box {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fcd34d;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .card-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .btn {
      flex: 1;
      min-width: 150px;
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .btn-primary { background: #10b981; color: #052e16; }
    .btn-primary:disabled { background: #1e293b; color: #64748b; cursor: default; }
    .btn-secondary { background: #1e293b; color: #e2e8f0; border: 1px solid #334155; }
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 999;
    }
    .modal-content {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 14px;
      max-width: 440px;
      width: 100%;
      padding: 22px;
    }
    .modal-title { font-size: 1.1rem; font-weight: 700; color: #34d399; margin-bottom: 12px; }
    .map-passos { color: #cbd5e1; line-height: 1.55; margin-bottom: 18px; white-space: pre-line; }
    @media (max-width: 520px) { .salas-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <div class="brand">SmartRoom • Tempo Real</div>
      <div class="controls">
        <select id="filtroCampus">
          <option value="TODOS">Todos os Campus</option>
          <option value="Carneiro da Cunha">Carneiro da Cunha</option>
          <option value="Bezerra de Menezes">Bezerra de Menezes</option>
          <option value="Conselheiro Estelita">Conselheiro Estelita</option>
          <option value="Maracanaú">Maracanaú</option>
        </select>
        <button type="button" id="btnAtivarAlertas" class="btn-top btn-notif">🔔 Ativar Alertas</button>
        <a href="./admin.html" class="btn-top" style="text-decoration:none;">Painel do Apoio</a>
      </div>
    </div>

    <div id="toastAlert" class="toast-alert"></div>

    <div id="listaRemanejamentos">
      <div class="status-box">Sincronizando alterações em tempo real...</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalMapa">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title" id="modalTitulo">📍 Localização da Nova Sala</div>
      <div class="map-passos" id="modalPassos"></div>
      <button type="button" class="btn btn-primary" style="width:100%;" id="btnFecharMapa">Entendido</button>
    </div>
  </div>

  <script type="module">
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch((err) => console.log('Erro SW:', err));
    }

    const cdn = "https:www//gstatic.com" + "/firebasejs/10.12.2/";

    const { initializeApp } = await import(cdn + "firebase-app.js");
    const { getDatabase, ref, onValue, runTransaction } = await import(cdn + "firebase-database.js");

    const firebaseConfig = {
      apiKey: "AIzaSyBXGRZJc4GM-ZwJaIMG3G80lV4JlLuz0c",
      authDomain: "smartroom-remanejamento" + ".firebaseapp.com",
      databaseURL: "https://" + "smartroom-remanejamento-default-rtdb" + ".firebaseio.com",
      projectId: "smartroom-remanejamento",
      storageBucket: "smartroom-remanejamento.firebasestorage.app",
      messagingSenderId: "465695973898",
      appId: "1:465695973898:web:f50b648cbe5761f542c193",
      measurementId: "G-87JM1VZ98X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const listaEl = document.getElementById('listaRemanejamentos');
    const filtroCampus = document.getElementById('filtroCampus');
    const btnAtivarAlertas = document.getElementById('btnAtivarAlertas');
    const toastAlert = document.getElementById('toastAlert');
    const modalMapa = document.getElementById('modalMapa');

    let dadosAtuais = {};
    let primeiraCarga = true;
    const idsConhecidos = new Set();
        function tocarSomAlerta() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.45);
      } catch (e) {}
    }

    function atualizarStatusBotaoNotif() {
      if ("Notification" in window && Notification.permission === "granted") {
        btnAtivarAlertas.textContent = "✅ Alertas Ativos";
        btnAtivarAlertas.classList.add("ativo");
      }
    }
    atualizarStatusBotaoNotif();

    btnAtivarAlertas.onclick = async () => {
      tocarSomAlerta();
      if ("Notification" in window) {
        const perm = await Notification.requestPermission();
        if (perm === "granted") {
          atualizarStatusBotaoNotif();
          const titulo = "SmartRoom • Alertas Ativados";
          const opcoes = {
            body: "Você será notificado imediatamente quando houver troca de sala.",
            icon: "./icons.svg",
            vibrate: new Array(200, 100, 200)
          };
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then((reg) => reg.showNotification(titulo, opcoes));
          } else {
            new Notification(titulo, opcoes);
          }
        } else {
          alert("Permissão negada. Libere as notificações nas configurações do navegador.");
        }
      }
    };

    function dispararNotificacaoNovaSala(item) {
      tocarSomAlerta();

      if ("vibrate" in navigator) {
        navigator.vibrate(new Array(300, 150, 300));
      }

      window.focus();
      window.scrollTo({ top: 0, behavior: "smooth" });

      toastAlert.textContent = `⚠️ Nova alteração: ${item.disc} (${item.sigla || 'Turma'}) ➔ ${item.nova}`;
      toastAlert.style.display = 'block';
      setTimeout(() => { toastAlert.style.display = 'none'; }, 12000);

      if ("Notification" in window && Notification.permission === "granted") {
        const titulo = `⚠️ Alteração de Sala: ${item.disc}`;
        const opcoes = {
          body: `De ${item.ant} para ${item.nova} (${item.campus || 'Campus'}). Motivo: ${item.motivo}\nToque aqui para abrir o painel!`,
          icon: "./icons.svg",
          badge: "./icons.svg",
          vibrate: new Array(300, 150, 300),
          requireInteraction: true,
          tag: "remanejamento-sala"
        };

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.ready.then((registration) => {
            registration.showNotification(titulo, opcoes);
          });
        } else {
          new Notification(titulo, opcoes);
        }
      }
    }

    document.getElementById('btnFecharMapa').onclick = () => { modalMapa.style.display = 'none'; };
    modalMapa.onclick = (e) => { if (e.target === modalMapa) modalMapa.style.display = 'none'; };

    window.abrirInstrucoes = (titulo, passos) => {
      document.getElementById('modalTitulo').textContent = titulo;
      document.getElementById('modalPassos').textContent = passos;
      modalMapa.style.display = 'flex';
    };

    window.confirmarCiencia = async (id, btn) => {
      if (localStorage.getItem('sr_conf_' + id)) return;
      btn.disabled = true;
      btn.textContent = 'Confirmando...';
      try {
        await runTransaction(ref(db, 'remanejamentos/' + id + '/confirmacoes'), (atual) => (atual || 0) + 1);
        localStorage.setItem('sr_conf_' + id, '1');
        btn.textContent = '✅ Ciência Confirmada';
      } catch (e) {
        btn.disabled = false;
        btn.textContent = 'Confirmar Ciência';
      }
    };

    function renderizarLista() {
      const campusSelecionado = filtroCampus.value;
      const entradas = Object.entries(dadosAtuais || {}).reverse();
      const filtrados = entradas.filter(([, item]) => {
        if (campusSelecionado === 'TODOS') return true;
        return (item.campus || '').toLowerCase() === campusSelecionado.toLowerCase();
      });

      if (filtrados.length === 0) {
        listaEl.innerHTML = '<div class="status-box">Nenhuma alteração de sala registrada no momento.</div>';
        return;
      }

      listaEl.innerHTML = '';
      filtrados.forEach(([id, item]) => {
        const jaConfirmou = !!localStorage.getItem('sr_conf_' + id);
        const totalConf = item.confirmacoes || 0;

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-header">
            <span class="badge-campus">📍 ${item.campus || 'Campus'}</span>
            <span class="hora">🕒 ${item.hora || 'Hoje'}</span>
          </div>
          <div class="disc-titulo">${item.disc || 'Disciplina'} ${item.sigla ? `(${item.sigla})` : ''}</div>
          <div class="prof-sub">Prof.: ${item.prof || 'Não informado'}</div>
          <div class="salas-grid">
            <div class="sala-box">
              <div class="sala-label">Sala Anterior</div>
              <div class="sala-valor">${item.ant || '-'}</div>
            </div>
            <div class="sala-box nova">
              <div class="sala-label">Nova Sala</div>
              <div class="sala-valor">${item.nova || '-'}</div>
            </div>
          </div>
          <div class="motivo-box"><strong>Motivo:</strong> ${item.motivo || 'Ajuste operacional'}</div>
          <div class="card-actions">
            <button type="button" class="btn btn-primary" ${jaConfirmou ? 'disabled' : ''} id="btn-conf-${id}">
              ${jaConfirmou ? `✅ Ciência Confirmada (${totalConf})` : `Confirmar Ciência (${totalConf})`}
            </button>
            ${item.ePassos ? `<button type="button" class="btn btn-secondary" id="btn-mapa-${id}">🗺️ Como Chegar</button>` : ''}
          </div>
        `;
        listaEl.appendChild(card);

        const btnConf = document.getElementById(`btn-conf-${id}`);
        if (btnConf && !jaConfirmou) {
          btnConf.onclick = () => window.confirmarCiencia(id, btnConf);
        }

        const btnMapa = document.getElementById(`btn-mapa-${id}`);
        if (btnMapa) {
          btnMapa.onclick = () => window.abrirInstrucoes(item.eTit || `Como chegar: ${item.nova}`, item.ePassos);
        }
      });
    }

    filtroCampus.onchange = renderizarLista;

    onValue(ref(db, 'remanejamentos'), (snapshot) => {
      dadosAtuais = snapshot.val() || {};
      const ids = Object.keys(dadosAtuais);

      if (primeiraCarga) {
        ids.forEach((id) => idsConhecidos.add(id));
        primeiraCarga = false;
      } else {
        ids.forEach((id) => {
          if (!idsConhecidos.has(id)) {
            idsConhecidos.add(id);
            dispararNotificacaoNovaSala(dadosAtuais[id]);
          }
        });
      }

      renderizarLista();
    }, (error) => {
      listaEl.innerHTML = `<div class="status-box">Erro ao conectar ao banco: ${error.message}</div>`;
    });
  </script>
</body>
</html>
